<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Aurora - Huwa</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000b1a url('lienzo-web.png') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .main-card {
            background: rgba(0, 0, 0, 0.85);
            padding: 40px;
            border-radius: 25px;
            border: 2px solid #00d4ff;
            text-align: center;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
        }
        h1 {
            color: #00d4ff;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .tagline {
            font-style: italic;
            margin-bottom: 30px;
            font-size: 14px;
            color: #ccc;
        }
        .menu-vertical {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        button {
            background: transparent;
            color: #00d4ff;
            border: 2px solid #00d4ff;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background: #00d4ff;
            color: #000;
        }
        #info-box {
            margin-top: 25px;
            font-size: 15px;
            text-align: left;
            min-height: 100px;
            border-top: 1px solid #333;
            padding-top: 15px;
        }
        .highlight { color: #f0ad4e; font-weight: bold; }
    </style>
</head>
<body>

    <div class="main-card">
        <h1>Proyecto Aurora</h1>
        <p class="tagline">"Materia gris en movimiento"</p>
        
        <div class="menu-vertical">
            <button onclick="mostrar('quienes')">¿Quiénes Somos?</button>
            <button onclick="mostrar('mision')">Misión y Visión</button>
            <button onclick="mostrar('objetivos')">Empoderamiento Femenino</button>
        </div>

        <div id="info-box">Selecciona una opción para comenzar.</div>
    </div>

    <script>
        function mostrar(seccion) {
            const box = document.getElementById('info-box');
            if(seccion === 'quienes') {
                box.innerHTML = "<strong>¿Quiénes Somos?</strong><br>Un semillero de conocimiento diseñado para que cada persona descubra su potencial técnico y creativo.";
            } else if(seccion === 'mision') {
                box.innerHTML = "<strong>Misión y Visión:</strong><br>Crear una economía sólida con Huwa, donde el aprendizaje sea la moneda de cambio real.";
            } else if(seccion === 'objetivos') {
                box.innerHTML = "<strong>Transformación Social:</strong><br>• <strong>Semillero Aurora Kids:</strong> Cursos de 20 min y 5 min de meditación para potenciar la inteligencia.<br>• <strong>Mujer:</strong> Motor de cambio social. Para la aprobación de múltiples llaves de acceso, <span class='highlight'>se requerirá</span> reservar siempre el cupo para las damas.";
            }
        }
    </script>
</body>
</html>
