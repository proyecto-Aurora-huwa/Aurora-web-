<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Aurora - Huwa</title>
    <style>
        body {
            background-color: #0b0e11;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        /* Barra Superior Limpia */
        .navbar {
            display: flex;
            align-items: center;
            padding: 15px 25px;
            background-color: #181c20;
            border-bottom: 2px solid #f3ba2f;
            position: fixed;
            top: 0; width: 100%; z-index: 1000;
            box-sizing: border-box;
        }

        /* Tu logo con el efecto de aura/resplandor */
        .navbar img { 
            height: 45px; 
            width: auto;
            margin-right: 15px; 
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.5)); /* El resplandor que sugerimos */
        }

        /* Nombre en Blanco Elegante */
        .navbar span { 
            font-weight: bold; 
            letter-spacing: 2px; 
            color: #ffffff; 
            font-size: 16px;
            text-transform: uppercase;
        }

        /* Botones Alargados Izquierda */
        .contenedor-botones {
            position: fixed;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 1001;
        }

        .btn-aurora {
            background: linear-gradient(90deg, #1e2329, #0b0e11);
            color: #f3ba2f;
            width: 220px; 
            padding: 16px 20px;
            display: flex;
            align-items: center;
            text-decoration: none;
            border: 1px solid #f3ba2f;
            border-left: none; 
            border-radius: 0 12px 12px 0;
            transition: all 0.4s ease;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .btn-aurora:hover {
            background: #f3ba2f;
            color: #0b0e11;
            width: 250px;
        }

        /* Hero Section con tu frase poderosa */
        .hero {
            margin-top: 220px;
            text-align: center;
            padding: 20px;
        }

        .hero h1 {
            font-size: clamp(60px, 12vw, 100px);
            margin: 0;
            letter-spacing: 10px;
            background: linear-gradient(to bottom, #ffffff, #f3ba2f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
        }

        .lema {
            color: #f3ba2f;
            font-weight: bold;
            letter-spacing: 5px;
            margin-top: 20px;
            font-size: 16px;
            text-transform: uppercase;
        }

        .descripcion {
            max-width: 750px;
            margin: 40px auto;
            color: #848e9c;
            font-size: 20px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <img src="logo1111.png" alt="Logo Aurora">
        <span>PROYECTO AURORA</span>
    </div>

    <div class="contenedor-botones">
        <a href="billetera.html" class="btn-aurora">Billetera Huwa</a>
        <a href="freelance.html" class="btn-aurora">Sección Freelance</a>
        <a href="cursos.html" class="btn-aurora">Cursos Laborales</a>
        <a href="kids.html" class="btn-aurora">Cursos Niños del Futuro</a>
    </div>

    <div class="hero">
        <h1>HUWA</h1>
        <p class="lema">"Materia gris en movimiento"</p>
        <div class="descripcion">
            Un ecosistema de aprendizaje y estabilidad financiera diseñado para empoderar comunidades en desarrollo a través del conocimiento.
        </div>
    </div>

</body>
</html>
