<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Aurora</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            background-color: #0b0b1a;
        }

        /* CONFIGURACIÓN DEL FONDO */
        .fondo {
            background-image: url('webaurora.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 70px;
        }

        /* CUADRO DE TEXTO INTERACTIVO */
        #texto-pantalla {
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px;
            border-radius: 15px;
            max-width: 85%;
            text-align: center;
            margin-bottom: 25px;
            border: 1px solid #FFD700;
            opacity: 0;
            transition: 0.5s;
        }

        /* BOTONES FLOTANTES */
        .botones-nav {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn-aurora {
            background-color: #FFD700;
            color: #1a1a1a;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
        }

        .dorado { color: #FFD700; font-weight: bold; }
    </style>
</head>
<body>

    <div class="fondo">
        <div id="texto-pantalla">Información del Proyecto</div>

        <div class="botones-nav">
            <button class="btn-aurora" onclick="ver('mision')">Misión</button>
            <button class="btn-aurora" onclick="ver('vision')">Visión</button>
            <button class="btn-aurora" onclick="ver('objetivos')">Objetivos</button>
        </div>
    </div>

    <script>
        function ver(tipo) {
            const cuadro = document.getElementById('texto-pantalla');
            cuadro.style.opacity = "1";

            if(tipo === 'mision') {
                cuadro.innerHTML = "Facilitar que cada persona pueda comprar, vender y aprender con <span class='dorado'>Huwa</span> [cite: 2025-12-26].";
            } else if(tipo === 'vision') {
                cuadro.innerHTML = "Ser el sello de calidad reconocido donde el aprendizaje sea la base de la economía [cite: 2025-12-30].";
            } else if(tipo === 'objetivos') {
                cuadro.innerHTML = "Para la seguridad de las llaves, <span class='dorado'>se requerirá</span> reservar el cupo para las damas [cite: 2026-01-02].";
            }
        }
    </script>

</body>
</html>
