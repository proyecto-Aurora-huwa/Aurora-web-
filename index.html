<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --fondo-oscuro: #0b0e11;
            --dorado-huwa: #f3ba2f;
            --blanco: #ffffff;
        }

        body {
            background-color: var(--fondo-oscuro);
            color: var(--blanco);
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Encabezado con el Logo Transparente */
        .header {
            width: 100%;
            padding: 20px;
            text-align: center;
            background: linear-gradient(180deg, #1e2329 0%, #0b0e11 100%);
        }

        .logo-principal {
            max-width: 200px;
            height: auto;
        }

        /* El Átomo (Icono de la moneda Huwa) */
        .atomo-container {
            margin-top: 40px;
            position: relative;
            text-align: center;
        }

        .atomo-img {
            width: 120px; /* Tamaño del sello de calidad */
            filter: drop-shadow(0 0 10px var(--dorado-huwa));
        }

        /* Menú de Hamburguesa */
        .boton-hamburguesa {
            position: fixed;
            top: 20px;
            right: 20px;
            cursor: pointer;
            z-index: 1001;
            background: #2b3139;
            padding: 10px;
            border-radius: 5px;
        }

        .boton-hamburguesa div {
            width: 25px; height: 3px;
            background-color: var(--dorado-huwa);
            margin: 5px 0;
            transition: 0.4s;
        }

        #menu-lateral {
            position: fixed; top: 0; right: -300px;
            width: 280px; height: 100%;
            background-color: #1e2329;
            transition: 0.5s;
            padding: 80px 20px;
            z-index: 1000;
            box-shadow: -10px 0 20px rgba(0,0,0,0.5);
        }

        #menu-lateral.abierto { right: 0; }
