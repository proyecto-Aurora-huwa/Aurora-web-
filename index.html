<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Aurora - Web Oficial</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0b1a;
        }

        /* FONDO TOTAL: Llamada exacta al archivo de tu GitHub */
        .contenedor-principal {
            background: url('PROYECTO AURORA_20260104_151242_0000.png') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end; /* Empuja los botones hacia la parte inferior */
            padding-bottom: 100px; /* Ajusta la altura de los botones aquí */
        }

        /* CAJA DE INFORMACIÓN (Efecto Cristal) */
        #info-box {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            color: white;
            padding: 20px;
            border-radius: 20px;
            max-width: 80%;
            text-align: center;
            margin-bottom: 30px;
            min-height: 80px;
            display: flex;
            align-items: center;
            border: 1px solid #FFD700; /* Borde amarillo para resaltar */
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        /* CONTENEDOR DE BOTONES FLOTANTES */
        .botones-flotantes {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            z-index: 10;
        }

        /* ESTILO DE BOTÓN AURORA (Alto Contraste) */
        .btn-aurora {
            background-color: #FFD700; /* Amarillo para resaltar sobre el morado */
            color: #0b0b1a;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(255, 215, 0, 0.3);
            transition: all 0.3s ease;
        }

        .btn-aurora:hover {
            transform: translateY(-8px); /* Efecto de flotar más alto */
            background-color: #ffffff;
            box-shadow: 0 15px 25px rgba(255, 215, 0, 0.5);
        }

        .resaltado { color: #FFD700; font-weight: bold; }
    </style>
</head>
<body>

    <div class="contenedor-principal">
        
        <div id="info-box">Bienvenida al Proyecto Aurora</div>

        <div class="botones-flotantes">
            <button class="btn-aurora" onclick="mostrar('mision')">Misión</button>
            <button class="btn-aurora" onclick="mostrar('vision')">Visión</button>
            <button class="btn-aurora" onclick="mostrar('objetivo')">Objetivo</button>
        </div>

    </div>

    <script>
        function mostrar(tipo) {
            const box = document.getElementById('info-box');
            box.style.opacity = "1";

            if(tipo === 'mision') {
                box.innerHTML = "<strong>Misión:</strong> Facilitar que cada persona pueda comprar, vender y aprender con facilidad usando <span class='resaltado'>Huwa</span> [cite: 2025-12-26].";
            } else if(tipo === 'vision') {
                box.innerHTML = "<strong>Visión:</strong> Ser el sello de calidad reconocido donde el aprendizaje técnico sea la base de la economía digital [cite: 2025-12-30].";
            } else if(tipo === 'objetivo') {
                box.innerHTML = "Para la seguridad y aprobación de llaves, <span class='resaltado'>se requerirá</span> reservar el cupo para las damas en formación [cite: 2026-01-02].";
            }
        }
    </script>

</body>
</html>
