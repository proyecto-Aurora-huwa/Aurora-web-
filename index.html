<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Aurora - Interactivo</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
        }

        /* EL LIENZO DE FONDO */
        .lienzo-container {
            background: url('PROYECTO AURORA_20260104_151242_0000.png') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* CAJA DE TEXTO DINÁMICA (Efecto Cristal) */
        #info-box {
            background: rgba(11, 11, 26, 0.8); /* Oscuro transparente */
            backdrop-filter: blur(10px); /* Desenfoque elegante */
            padding: 25px;
            border-radius: 20px;
            border: 1px solid #FFD700;
            color: white;
            max-width: 500px;
            text-align: center;
            margin-bottom: 30px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 10;
            opacity: 0; /* Empieza invisible */
            transition: opacity 0.5s ease;
        }

        /* CONTENEDOR DE BOTONES FLOTANTES */
        .nav-aurora {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            z-index: 10;
        }

        /* BOTONES AMARILLOS (ALTO CONTRASTE) */
        .btn-interactivo {
            background-color: #FFD700;
            color: #0b0b1a;
            border: none;
            padding: 15px 25px;
            border-radius: 50px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(255, 215, 0, 0.3);
            transition: 0.3s;
        }

        .btn-interactivo:hover {
            transform: translateY(-5px);
            background-color: #00E5FF; /* Cambia a Cian al tocar */
        }

        .highlight { color: #FFD700; font-weight: bold; }
    </style>
</head>
<body>

    <div class="lienzo-container">
        
        <div id="info-box">Toca un botón para conocer nuestra energía</div>

        <div class="nav-aurora">
            <button class="btn-interactivo" onclick="mostrar('quienes')">¿Quiénes Somos?</button>
            <button class="btn-interactivo" onclick="mostrar('mision')">Misión y Visión</button>
            <button class="btn-interactivo" onclick="mostrar('objetivos')">Objetivos</button>
        </div>
    </div>

    <script>
        function mostrar(tipo) {
            const box = document.getElementById('info-box');
            box.style.opacity = "1"; // Hace visible la caja

            if(tipo === 'quienes') {
                box.innerHTML = "Somos un semillero diseñado para que cada ciudadano descubra su potencial creativo y técnico [cite: 2025-12-30].";
            } else if(tipo === 'mision') {
                box.innerHTML = "<strong>Misión:</strong> Facilitar el uso de <span class='highlight'>Huwa</span> para aprender y progresar [cite: 2025-12-26]. <br><br> <strong>Visión:</strong> Ser el sello de calidad y producción en Venezuela [cite: 2025-12-30].";
            } else if(tipo === 'objetivos') {
                box.innerHTML = "Para la seguridad y aprobación de llaves, <span class='highlight'>se requerirá</span> reservar el cupo para las damas en formación [cite: 2026-01-02].";
            }
        }
    </script>

</body>
</html>
