<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Aurora - Huwa</title>
    <style>
        body {
            background-color: #0b0e11;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
        }

        /* Barra Superior */
        .navbar {
            display: flex;
            align-items: center;
            padding: 10px 20px;
            background-color: #181c20;
            border-bottom: 1px solid #2b3139;
            position: fixed;
            top: 0; width: 100%; z-index: 1000;
            box-sizing: border-box;
        }

        .navbar img {
            height: 35px; 
            margin-right: 12px;
        }

        .navbar span {
            font-weight: bold;
            letter-spacing: 1px;
            font-size: 14px;
            color: #eaecef;
        }

        .hamburguesa {
            margin-left: auto;
            cursor: pointer;
        }

        .hamburguesa div {
            width: 22px; height: 2px;
            background-color: #f3ba2f;
            margin: 4px 0;
        }

        /* Menú Lateral */
        #menu {
            position: fixed; top: 0; right: -350px;
            width: 300px; height: 100%;
            background: #1e2329;
            transition: 0.4s;
            padding: 80px 20px;
            z-index: 999;
            box-shadow: -5px 0 15px rgba(0,0,0,0.5);
        }

        #menu.abierto { right: 0; }

        /* --- BOTONES FLOTANTES IZQUIERDA --- */
        .botones-flotantes {
            position: fixed;
            left: 0; /* Cambiado a la izquierda */
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 1001;
        }

        .btn-f {
            display: flex;
            align-items: center;
            padding: 12px 18px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            font-size: 13px;
            border-radius: 0 8px 8px 0; /* Redondeado solo a la derecha */
            transition: 0.3s;
            box-shadow: 4px 4px 10px rgba(0,0,0,0.3);
            width: 160px;
            margin-left: -120px; /* Efecto pestaña: solo sale el icono */
        }

        .btn-f:hover {
            margin-left: 0; /* Se desliza hacia afuera al pasar el mouse */
        }

        .btn-f i {
            margin-left: auto;
            font-size: 18px;
            font-style: normal;
        }

        /* Colores temáticos */
        .btn-billetera { background: linear-gradient(90deg, #02aab0, #00cdac); border-left: 4px solid #fff; }
        .btn-freelance { background: linear-gradient(90deg, #0052d4, #4364f7); border-left: 4px solid #fff; }
        .btn-damas { background: linear-gradient(90deg, #6a11cb, #2575fc); border-left: 4px solid #fff; }
        .btn-kids { background: linear-gradient(90deg, #f2994a, #f2c94c); border-left: 4px solid #fff; }

        /* Contenido Central */
        .hero {
            margin-top: 180px;
            text-align: center;
            padding: 20px;
        }

        .texto-dorado { color: #f3ba2f; font-weight: bold; text-transform: uppercase; }

        /* Móvil */
        @media (max-width: 600px) {
            .btn-f { margin-left: -130px; width: 150px; }
        }
    </style>
</head>
<body>

    <div class="navbar">
        <img src="logo 11.png" alt="Logo Aurora">
        <span>PROYECTO AURORA</span>
        <div class="hamburguesa" onclick="toggleMenu()">
            <div></div><div></div><div></div>
        </div>
    </div>

    <nav id="menu">
        <h3>✨ Nuestra Esencia</h3>
        <p>Aurora es el primer suspiro de luz que vence a la oscuridad.</p>
        <hr style="border: 0.1px solid #333;">
        <p style="font-size: 11px; color: #f3ba2f;">Seguridad: se requerirá aprobación multillave.</p>
    </nav>

    <div class="botones-flotantes">
        <a href="#" class="btn-f btn-billetera">BILLETERA <i>💰</i></a>
        <a href="#" class="btn-f btn-freelance">FREELANCE <i>💼</i></a>
        <a href="#" class="btn-f btn-damas">CURSOS DAMAS <i>👩‍🏫</i></a>
        <a href="#" class="btn-f btn-kids">SEMILLEROS KIDS <i>🌱</i></a>
    </div>

    <div class="hero">
        <h1 style="font-size: 55px; margin-bottom: 5px;">HUWA</h1>
        <p class="texto-dorado">"Materia gris en movimiento"</p>
        <p style="max-width: 600px; margin: 20px auto; color: #848e9c;">
            Minería Educativa para el empoderamiento social.
        </p>
    </div>

    <script>
        function toggleMenu() {
            document.getElementById("menu").classList.toggle("abierto");
        }
    </script>
</body>
</html>
