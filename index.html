<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Aurora - Huwa</title>
    <style>
        body {
            background-color: #0b0e11;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        /* Barra Superior */
        .navbar {
            display: flex;
            align-items: center;
            padding: 10px 20px;
            background-color: #181c20;
            border-bottom: 2px solid #f3ba2f;
            position: fixed;
            top: 0; width: 100%; z-index: 1000;
            box-sizing: border-box;
        }

        /* El recuadro blanco para que resalte tu logo azul */
        .identidad-contenedor {
            display: flex;
            align-items: center;
            background-color: #ffffff; /* Fondo blanco para contraste */
            padding: 5px 15px;
            border-radius: 30px; /* Forma de cápsula */
            box-shadow: 0 2px 10px rgba(255,255,255,0.1);
        }

        .identidad-contenedor img { 
            height: 40px; 
            width: auto;
            margin-right: 12px; 
        }

        .identidad-contenedor span { 
            font-weight: bold; 
            letter-spacing: 1px; 
            color: #000000; /* Texto negro sobre fondo blanco */
            font-size: 14px;
            text-transform: uppercase;
        }

        /* --- BOTONES ALARGADOS IZQUIERDA --- */
        .contenedor-botones {
            position: fixed;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 1001;
        }

        .btn-aurora {
            background: linear-gradient(90deg, #1e2329, #0b0e11);
            color: #f3ba2f;
            width: 210px; 
            padding: 16px 20px;
            display: flex;
            align-items: center;
            text-decoration: none;
            border: 1px solid #f3ba2f;
            border-left: none; 
            border-radius: 0 12px 12px 0;
            transition: all 0.4s ease;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.6);
        }

        .btn-aurora:hover {
            background: #f3ba2f;
            color: #0b0e11;
            width: 240px;
            padding-left: 35px;
        }

        /* Hero Section */
        .hero {
            margin-top: 220px;
            text-align: center;
            padding: 20px;
        }

        .hero h1 {
            font-size: clamp(55px, 12vw, 95px);
            margin: 0;
            letter-spacing: 10px;
            background: linear-gradient(to bottom, #ffffff, #f3ba2f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
        }

        .lema {
            color: #f3ba2f;
            font-weight: bold;
            letter-spacing: 4px;
            margin-top: 20px;
            font-size: 14px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="identidad-contenedor">
            <img src="logo1111.png" alt="Logo Aurora">
            <span>PROYECTO AURORA</span>
        </div>
    </div>

    <div class="contenedor-botones">
        <a href="billetera.html" class="btn-aurora">Billetera Huwa</a>
        <a href="freelance.html" class="btn-aurora">Sección Freelance</a>
        <a href="cursos.html" class="btn-aurora">Cursos Laborales</a>
        <a href="kids.html" class="btn-aurora">Cursos Niños del Futuro</a>
    </div>

    <div class="hero">
        <h1>HUWA</h1>
        <p class="lema">"Materia gris en movimiento"</p>
    </div>

</body>
</html>
