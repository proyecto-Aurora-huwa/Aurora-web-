<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Aurora - Huwa</title>
    <style>
        body {
            background-color: #0b0e11;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* Barra Superior */
        .navbar {
            display: flex;
            align-items: center;
            padding: 0 25px;
            background-color: #181c20;
            border-bottom: 2px solid #f3ba2f;
            position: fixed;
            top: 0; 
            width: 100%; 
            z-index: 1000;
            box-sizing: border-box;
            height: 80px; /* Altura ideal para el logo grande */
        }

        /* El Logo con Brillo de Átomo (Energía) */
        .navbar img { 
            height: 65px; 
            width: auto;
            margin-right: 18px; 
            /* Doble resplandor: uno blanco fuerte y uno dorado suave */
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.8)) 
                    drop-shadow(0 0 5px rgba(243, 186, 47, 0.4));
            transition: 0.5s ease;
        }

        .navbar img:hover {
            filter: drop-shadow(0 0 25px rgba(255, 255, 255, 0.95));
            transform: scale(1.02);
        }

        /* Proyecto Aurora en Blanco */
        .navbar span { 
            font-weight: bold; 
            letter-spacing: 2px; 
            color: #ffffff; 
            font-size: 15px;
            text-transform: uppercase;
        }

        /* Contenedor de Botones Laterales */
        .contenedor-botones {
            position: fixed;
            left: 0;
            top: 55%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 1001;
        }

        .btn-aurora {
            background: linear-gradient(90deg, #1e2329, #0b0e11);
            color: #f3ba2f;
            width: 220px; 
            padding: 16px 20px;
            display: flex;
            align-items: center;
            text-decoration: none;
            border: 1px solid #f3ba2f;
            border-left: none; 
            border-radius: 0 12px 12px 0;
            transition: all 0.4s ease;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.6);
        }

        .btn-aurora:hover {
            background: #f3ba2f;
            color: #0b0e11;
            width: 250px;
            padding-left: 35px;
            box-shadow: 0 0 20px rgba(243, 186, 47, 0.3);
        }

        /* Sección Principal (Hero) */
        .hero {
            margin-top: 240px;
            text-align: center;
            padding: 20px;
        }

        .hero h1 {
            font-size: clamp(60px, 12vw, 100px);
            margin: 0;
            letter-spacing: 10px;
            background: linear-gradient(to bottom, #ffffff, #f3ba2f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
        }

        .lema {
            color: #f3ba2f;
            font-weight: bold;
            letter-spacing: 5px;
            margin-top: 20px;
            font-size: 16px;
            text-transform: uppercase;
        }

        .descripcion {
            max-width: 750px;
            margin: 40px auto;
            color: #848e9c;
            font-size: 20px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <img src="logo1111.png" alt="Logo Proyecto Aurora">
        <span>PROYECTO AURORA</span>
    </div>

    <div class="contenedor-botones">
        <a href="billetera.html" class="btn-aurora">Billetera Huwa</a>
        <a href="freelance.html" class="btn-aurora">Sección Freelance</a>
        <a href="cursos.html" class="btn-aurora">Cursos Laborales</a>
        <a href="kids.html" class="btn-aurora">Cursos Niños del Futuro</a>
    </div>

    <div class="hero">
        <h1>HUWA</h1>
        <p class="lema">"Materia gris en movimiento"</p>
        <div class="descripcion">
            Un ecosistema de aprendizaje y estabilidad financiera diseñado para empoderar comunidades en desarrollo a través del conocimiento.
        </div>
    </div>

</body>
</html>
