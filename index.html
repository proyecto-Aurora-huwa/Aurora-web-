<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Aurora - Interactivo</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            background-color: #0b0b1a;
        }

        /* FONDO: Aquí llamamos a tu lienzo exacto */
        .contenedor-aurora {
            background-image: url('PROYECTO%20AURORA_20260104_151242_0000.png');
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end; /* Botones abajo como en tu foto */
            padding-bottom: 120px;
        }

        /* CAJA DE TEXTO (Efecto Cristal) */
        #info-box {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(10px);
            color: white;
            padding: 20px;
            border-radius: 20px;
            max-width: 85%;
            text-align: center;
            margin-bottom: 40px;
            min-height: 60px;
            display: flex;
            align-items: center;
            border: 1px solid #FFD700;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        /* BOTONES FLOTANTES AMARILLOS */
        .nav-botones {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-aurora {
            background-color: #FFD700; /* Amarillo de tu foto */
            color: #0b0b1a;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(255, 215, 0, 0.4);
            transition: 0.3s;
        }

        .btn-aurora:hover {
            transform: translateY(-5px);
            background-color: #ffffff;
        }

        .resaltado { color: #FFD700; font-weight: bold; }
    </style>
</head>
<body>

    <div class="contenedor-aurora">
        
        <div id="info-box">Cargando energía Aurora...</div>

        <div class="nav-botones">
            <button class="btn-aurora" onclick="mostrar('somos')">¿Quiénes Somos?</button>
            <button class="btn-aurora" onclick="mostrar('mision')">Misión y Visión</button>
            <button class="btn-aurora" onclick="mostrar('objetivos')">Objetivos</button>
        </div>
        
    </div>

    <script>
        function mostrar(seccion) {
            const box = document.getElementById('info-box');
            box.style.opacity = "1";

            if(seccion === 'somos') {
                box.innerHTML = "Somos un semillero diseñado para que cada ciudadano descubra su potencial técnico y creativo.";
            } else if(seccion === 'mision') {
                box.innerHTML = "<strong>Misión:</strong> Facilitar el uso de <span class='resaltado'>Huwa</span> para aprender. <br> <strong>Visión:</strong> Ser el sello de calidad y producción en Venezuela.";
            } else if(seccion === 'objetivos') {
                box.innerHTML = "Para la aprobación de llaves, <span class='resaltado'>se requerirá</span> reservar el cupo para las damas en formación.";
            }
        }
    </script>

</body>
</html>
