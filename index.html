<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Aurora - Huwa</title>
    <style>
        body {
            background-color: #0b0e11;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* Barra Superior */
        .navbar {
            display: flex;
            align-items: center;
            padding: 0 30px;
            background-color: #181c20;
            border-bottom: 2px solid #f3ba2f;
            position: fixed;
            top: 0; 
            width: 100%; 
            z-index: 1000;
            box-sizing: border-box;
            height: 95px; /* Barra más robusta para el logo más grande */
        }

        /* LOGO MAXIMIZADO CON LUMINOSIDAD ATÓMICA */
        .navbar img { 
            height: 80px; /* Tamaño máximo sugerido para que luzca imponente */
            width: auto;
            margin-right: 20px; 
            /* Triple capa de brillo para un efecto de luz real */
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.9)) 
                    drop-shadow(0 0 20px rgba(255, 255, 255, 0.6))
                    drop-shadow(0 0 30px rgba(243, 186, 47, 0.3));
            transition: 0.5s ease-in-out;
        }

        .navbar img:hover {
            filter: drop-shadow(0 0 40px rgba(255, 255, 255, 1));
            transform: scale(1.05);
        }

        /* Proyecto Aurora en Blanco Elegante */
        .navbar span { 
            font-weight: bold; 
            letter-spacing: 3px; 
            color: #ffffff; 
            font-size: 16px;
            text-transform: uppercase;
        }

        /* Menú Lateral */
        .contenedor-botones {
            position: fixed;
            left: 0;
            top: 55%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 1001;
        }

        .btn-aurora {
            background: linear-gradient(90deg, #1e2329, #0b0e11);
            color: #f3ba2f;
            width: 230px; 
            padding: 16px 20px;
            display: flex;
            align-items: center;
            text-decoration: none;
            border: 1px solid #f3ba2f;
            border-left: none; 
            border-radius: 0 12px 12px 0;
            transition: all 0.4s ease;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.6);
        }

        .btn-aurora:hover {
            background: #f3ba2f;
            color: #0b0e11;
            width: 260px;
            padding-left: 35px;
        }

        /* Hero Section */
        .hero {
            margin-top: 260px;
            text-align: center;
            padding: 20px;
        }

        .hero h1 {
            font-size: clamp(65px, 15vw, 110px);
            margin: 0;
            letter-spacing: 12px;
            background: linear-gradient(to bottom, #ffffff, #f3ba2f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
        }

        .lema {
            color: #f3ba2f;
            font-weight: bold;
            letter-spacing: 6px;
            margin-top: 20px;
            font-size: 18px;
            text-transform: uppercase;
        }

        .descripcion {
            max-width: 800px;
            margin: 45px auto;
            color: #848e9c;
            font-size: 21px;
            line-height: 1.7;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <img src="logo1111.png" alt="Logo Proyecto Aurora">
        <span>PROYECTO AURORA</span>
    </div>

    <div class="contenedor-botones">
        <a href="billetera.html" class="btn-aurora">Billetera Huwa</a>
        <a href="freelance.html" class="btn-aurora">Sección Freelance</a>
        <a href="cursos.html" class="btn-aurora">Cursos Laborales</a>
        <a href="kids.html" class="btn-aurora">Cursos Niños del Futuro</a>
    </div>

    <div class="hero">
        <h1>HUWA</h1>
        <p class="lema">"Materia gris en movimiento"</p>
        <div class="descripcion">
            Un ecosistema de aprendizaje y estabilidad financiera diseñado para empoderar comunidades en desarrollo a través del conocimiento.
        </div>
    </div>

</body>
</html>
