<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Aurora - Huwa</title>
    <style>
        body {
            background-color: #0b0e11; /* Fondo oscuro tipo Binance */
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        /* Botón de Hamburguesa */
        .hamburguesa {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            cursor: pointer;
            background: #2b3139;
            padding: 10px;
            border-radius: 5px;
        }
        .hamburguesa div {
            width: 25px;
            height: 3px;
            background-color: #f3ba2f;
            margin: 5px 0;
        }

        /* Menú escondido */
        #menu {
            position: fixed;
            top: 0;
            right: -300px;
            width: 250px;
            height: 100%;
            background: #1e2329;
            transition: 0.3s;
            padding-top: 60px;
            text-align: left;
            box-shadow: -5px 0 15px rgba(0,0,0,0.5);
        }
        #menu a {
            display: block;
            padding: 15px 25px;
            color: white;
            text-decoration: none;
            border-bottom: 1px solid #2b3139;
        }

        /* Logos */
        .contenedor-logos {
            padding: 20px;
            margin-top: 50px;
        }
        .logo-traspar {
            max-width: 80%;
            height: auto;
        }
        .atomo {
            width: 150px;
            margin-top: 30px;
            filter: drop-shadow(0 0 8px #f3ba2f);
        }

        .texto-huwa {
            color: #f3ba2f;
            font-size: 24px;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="hamburguesa" onclick="toggleMenu()">
        <div></div><div></div><div></div>
    </div>

    <nav id="menu">
        <a href="#">Perfil / Configuración</a>
        <a href="#">Quiénes Somos</a>
        <a href="#">Visión y Objetivos</a>
        <a href="#">Regístrate</a>
        <p style="font-size: 11px; color: #848e9c; padding: 20px;">
            Seguridad: para la aprobación de múltiples llaves **se requerirá** el consenso administrativo.
        </p>
    </nav>

    <div class="contenedor-logos">
        <img src="logo traspar.png" alt="Proyecto Aurora" class="logo-traspar">
        <br>
        <img src="atomo.png" alt="Huwa" class="atomo">
        <div class="texto-huwa">HUWA</div>
        <p>Semillero de Conocimiento</p>
    </div>

    <script>
        function toggleMenu() {
            var menu = document.getElementById("menu");
            if (menu.style.right === "0px") {
                menu.style.right = "-300px";
            } else {
                menu.style.right = "0px";
            }
        }
    </script>
</body>
</html>
